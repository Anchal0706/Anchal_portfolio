<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="warm" cx="20%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#ffcf80" stop-opacity="0.42"/>
      <stop offset="60%" stop-color="#ff9040" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0a0e17" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="85%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0a0e17" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="text-shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff8e5"/>
      <stop offset="100%" stop-color="#ffcf80"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0a0e17"/>
  <rect width="1200" height="630" fill="url(#warm)"/>
  <rect width="1200" height="630" fill="url(#cool)"/>

  <!-- subtle dust pattern -->
  <g fill="#f5e5cc" opacity="0.08">
    <circle cx="180" cy="120" r="1.5"/>
    <circle cx="320" cy="80" r="1"/>
    <circle cx="540" cy="200" r="1.5"/>
    <circle cx="780" cy="150" r="1"/>
    <circle cx="980" cy="100" r="1.5"/>
    <circle cx="1080" cy="220" r="1"/>
    <circle cx="240" cy="490" r="1"/>
    <circle cx="700" cy="540" r="1.5"/>
    <circle cx="940" cy="440" r="1"/>
  </g>

  <!-- top label -->
  <text x="80" y="100"
        font-family="ui-monospace, 'SF Mono', monospace"
        font-size="18" letter-spacing="6"
        fill="#14b8a6" opacity="0.85">— ANCHAL MISHRA</text>

  <!-- main wordmark -->
  <text x="80" y="320"
        font-family="Georgia, serif" font-style="italic"
        font-weight="700" font-size="148"
        fill="url(#text-shine)" letter-spacing="-3">Content.</text>
  <text x="80" y="470"
        font-family="Georgia, serif" font-style="italic"
        font-weight="700" font-size="148"
        fill="#14b8a6" letter-spacing="-3">AI. Clarity.</text>

  <!-- Skills strip -->
  <g font-family="ui-monospace, monospace" font-size="16" letter-spacing="3" fill="#f5e5cc" opacity="0.7">
    <text x="80" y="555">CONTENT STRATEGY</text>
    <text x="345" y="555">·</text>
    <text x="370" y="555">SEO INTELLIGENCE</text>
    <text x="640" y="555">·</text>
    <text x="665" y="555">RLHF / SFT</text>
    <text x="830" y="555">·</text>
    <text x="855" y="555">AI ALIGNMENT</text>
  </g>

  <!-- corner accent -->
  <g transform="translate(1010,90)">
    <circle cx="60" cy="60" r="55" fill="none" stroke="#ffb060" stroke-width="2" opacity="0.55"/>
    <circle cx="60" cy="60" r="34" fill="#ffb060" opacity="0.15"/>
    <circle cx="60" cy="60" r="14" fill="#ffcf80"/>
  </g>
</svg>
